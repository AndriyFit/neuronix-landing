<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neuronix Consultant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdfa',
                            100: '#ccfbf1',
                            500: '#14b8a6',
                            600: '#0d9488',
                            900: '#134e4a',
                            950: '#042f2e',
                        }
                    }
                }
            }
        }
    </script>
        <style>
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        
        .prose p { margin-bottom: 0.6em; }
        .prose p:last-child { margin-bottom: 0; }
        .prose ul { list-style-type: disc; padding-left: 1.3em; margin-bottom: 0.6em; }
        .prose ol { list-style-type: decimal; padding-left: 1.3em; margin-bottom: 0.6em; }
        .prose li { margin-bottom: 0.2em; }
        .prose strong { font-weight: 600; color: inherit; }
        .prose a { color: #0d9488; text-decoration: underline; }
        .prose a:hover { color: #134e4a; }
        .prose table { width: 100%; border-collapse: collapse; margin-bottom: 0.6em; font-size: 0.875rem; }
        .prose th, .prose td { border: 1px solid #e2e8f0; padding: 4px 8px; text-align: left; }
        .prose th { background-color: #f8fafc; font-weight: 600; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 h-screen overflow-hidden flex flex-col font-sans">
    <div id="root" class="h-full flex flex-col"></div>

<script type="module" src="/index.js"></script></body>
